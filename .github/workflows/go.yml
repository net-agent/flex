name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Check formatting
      run: test -z "$(gofmt -l .)"

    - name: Vet
      run: go vet ./...

    - name: Staticcheck
      run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...

    - name: Test
      run: go test -count=1 -race -shuffle=on -timeout 5m ./...

    - name: Check docs and examples
      run: ./scripts/check-docs.sh

    - name: Run Coverage
      run: ./coverage_test.sh
      env:
        COVERAGE_MIN: '95'

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.txt
